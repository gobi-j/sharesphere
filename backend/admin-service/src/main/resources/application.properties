spring.application.name=admin-service
server.port=${PORT:8089}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/admin_db}
spring.datasource.username=${DB_USER:sharesphere}
spring.datasource.password=${DB_PASSWORD:sharesphere_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
services.booking=${BOOKING_SERVICE_URL:http://localhost:8084}
sharesphere.internal.token=${INTERNAL_SERVICE_TOKEN:local-internal-service-token-change-me}
