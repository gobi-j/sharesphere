spring.application.name=borrowcircle-service
server.port=${PORT:8083}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/borrowcircle_db}
spring.datasource.username=${DB_USER:sharesphere}
spring.datasource.password=${DB_PASSWORD:sharesphere_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
services.community=${COMMUNITY_SERVICE_URL:http://localhost:8082}
sharesphere.internal.token=${INTERNAL_SERVICE_TOKEN:local-internal-service-token-change-me}
sharesphere.upload.dir=${SHARES_UPLOAD_DIR:/data/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
