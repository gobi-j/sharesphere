spring.application.name=booking-service
server.port=${PORT:8084}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking_db}
spring.datasource.username=${DB_USER:sharesphere}
spring.datasource.password=${DB_PASSWORD:sharesphere_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:sharesphere}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:sharesphere_local}
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
sharesphere.internal.token=${INTERNAL_SERVICE_TOKEN:local-internal-service-token-change-me}
services.borrowcircle=${BORROWCIRCLE_SERVICE_URL:http://localhost:8083}
services.community=${COMMUNITY_SERVICE_URL:http://localhost:8082}
