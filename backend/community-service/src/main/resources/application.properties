spring.application.name=community-service
server.port=${PORT:8082}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/community_db}
spring.datasource.username=${DB_USER:sharesphere}
spring.datasource.password=${DB_PASSWORD:sharesphere_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
sharesphere.internal.token=${INTERNAL_SERVICE_TOKEN:local-internal-service-token-change-me}
