spring.application.name=payments-service
server.port=${PORT:8085}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payments_db}
spring.datasource.username=${DB_USER:sharesphere}
spring.datasource.password=${DB_PASSWORD:sharesphere_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
sharesphere.payments.payee-name=${UPI_PAYEE_NAME:ShareSphere}
sharesphere.payments.webhook-secret=${UPI_WEBHOOK_SECRET:}
sharesphere.internal.token=${INTERNAL_SERVICE_TOKEN:local-internal-service-token-change-me}
services.booking=${BOOKING_SERVICE_URL:http://localhost:8084}
services.auth=${AUTH_SERVICE_URL:http://localhost:8081}
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
