spring.application.name=auth-service
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USER:sharesphere}
spring.datasource.password=${DB_PASSWORD:sharesphere_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
sharesphere.jwt.secret=${JWT_SECRET:local-only-change-me-to-a-long-random-value-1234567890}
sharesphere.jwt.ttl-minutes=720
sharesphere.admin.emails=${ADMIN_EMAILS:}
sharesphere.internal.token=${INTERNAL_SERVICE_TOKEN:local-internal-service-token-change-me}
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
