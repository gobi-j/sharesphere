spring.application.name=notifications-service
server.port=${PORT:8087}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notifications_db}
spring.datasource.username=${DB_USER:sharesphere}
spring.datasource.password=${DB_PASSWORD:sharesphere_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:sharesphere}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:sharesphere_local}
management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
